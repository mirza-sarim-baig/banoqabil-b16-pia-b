<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Conditional Statements</h1>
    <h2>Bill Generator</h2>
    <!-- <form onsubmit="greet()"> -->
    <label
      >Enter your name
      <input type="text" placeholder="Enter your name" id="userName" />
    </label>
    <br />
    <br />
    <label
      >Enter meat type
      <input type="text" placeholder="beef, chicken" id="meatType" />
    </label>
    <br />
    <br />
    <label
      >Enter bun type
      <input type="text" placeholder="sweet, plain" id="bunType" />
    </label>
    <br />
    <br />
    <label
      >Enter drink flavour
      <input type="text" placeholder="black, white" id="drinkFlavour" />
    </label>
    <br />
    <br />
    <label
      >Total order quantity
      <input type="text" placeholder="in numbers" id="orderQuantity" />
    </label>
    <br />
    <br />
    <button onclick="billGenerator()">Submit</button>

    <!-- <input type="submit" /> -->
    <!-- </form> -->

    <h2>SIGNUP FORM</h2>

    <label>
      Username:
      <input type="text" placeholder="Enter your username" id="loginName" />
    </label>

    <br />
    <br />
    <label>
      Email:
      <input type="email" placeholder="Enter your Email" id="email" />
    </label>
    <br />
    <br />
    <label>
      Password:
      <input type="password" placeholder="Enter your password" id="pass" />
    </label>
    <br />
    <br />
    <label>
      Confirm Password:
      <input type="password" placeholder="Enter your password" id="cPass" />
    </label>
    <br />
    <br />
    <button onclick="signupFunc()">Signup</button>
    <br />
    <br />
    <br />
    <br />
    <br />

    <br />
